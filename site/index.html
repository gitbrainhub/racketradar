<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Racket Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a watchlist column (home base) beside a searchable list of rackets, each comparing the same racket across stores. Court-line drawing is the one subject detail. */
:root {
  --bg: #EEF2EF;
  --surface: #FFFFFF;
  --surface-2: #E4EBE6;
  --ink: #13201B;
  --ink-2: #4A5A53;
  --line: #C9D4CD;
  --court: #0E6A51;
  --court-ink: #FFFFFF;
  --sale: #B8420C;
  --knob: #FFFFFF;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1613;
    --surface: #16211C;
    --surface-2: #1F2D26;
    --ink: #E8F0EB;
    --ink-2: #9DB0A6;
    --line: #2B3B34;
    --court: #4FD1A8;
    --court-ink: #04241A;
    --sale: #FF9A62;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1613;
  --surface: #16211C;
  --surface-2: #1F2D26;
  --ink: #E8F0EB;
  --ink-2: #9DB0A6;
  --line: #2B3B34;
  --court: #4FD1A8;
  --court-ink: #04241A;
  --sale: #FF9A62;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.brand-row { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mark { width: 28px; height: 44px; color: var(--court); flex: none; }
h1 { font-size: 32px; font-weight: 700; letter-spacing: 0.01em; line-height: 1; }
.tagline { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.plan { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pill { font: 500 12px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 7px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.pill.on { background: var(--court); color: var(--court-ink); }
.switch { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 0; background: none; border: 0; color: var(--ink); font: 500 14px var(--font-body); cursor: pointer; }
.track { width: 42px; height: 24px; border-radius: 12px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--knob); transition: transform .15s; }
.switch[aria-checked="true"] .track { background: var(--court); }
.switch[aria-checked="true"] .track::after { transform: translateX(18px); }

.demo-note { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 24px; }
.demo-note strong { color: var(--ink); font-weight: 600; }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 28px; align-items: start; }
.watch { position: sticky; top: 16px; display: grid; gap: 12px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .watch { position: static; }
}
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 { font-size: 24px; font-weight: 600; letter-spacing: 0.01em; }
.count { font: 500 13px var(--font-mono); color: var(--ink-2); }
.sub { color: var(--ink-2); font-size: 13px; }
.note { font-size: 13px; border: 1px solid var(--sale); color: var(--sale); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; justify-items: start; }
.note[hidden] { display: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--court); background: var(--court); color: var(--court-ink); font: 600 14px var(--font-body); text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--court); }
.btn.ghost[aria-pressed="true"] { background: var(--court); color: var(--court-ink); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--ink-2); font: 500 13px var(--font-body); text-decoration: underline; cursor: pointer; min-height: 32px; }

/* watchlist cards */
.wlist { display: grid; gap: 12px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.wtop { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.brand { font: 500 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
h3 { font-size: 21px; font-weight: 600; line-height: 1.15; }
.wprice { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big { font: 600 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.at { color: var(--ink-2); font-size: 13px; }
.slot { border: 1.5px dashed var(--line); border-radius: 10px; min-height: 84px; display: grid; place-items: center; text-align: center; color: var(--ink-2); font-size: 14px; padding: 12px; }
.locked { font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; }
.spark { width: 100%; max-width: 240px; height: auto; display: block; }
.spark .line { fill: none; stroke: var(--court); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark .area { fill: var(--court); opacity: .12; }
.spark .dot { fill: var(--court); }
.spark-cap { font: 400 12px var(--font-mono); color: var(--ink-2); }
.alert-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; }
.money-in { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--bg); font-family: var(--font-mono); }
.money-in input { width: 70px; min-height: 34px; border: 0; background: transparent; color: var(--ink); font: 500 14px var(--font-mono); }
.money-in input:focus-visible { outline: none; }
.money-in:focus-within { outline: 2px solid var(--court); outline-offset: 2px; }
.chip { font: 500 12px/1 var(--font-mono); padding: 6px 8px; border-radius: 6px; background: var(--court); color: var(--court-ink); }
.chip[hidden] { display: none; }

.upgrade { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.upgrade ul { display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.upgrade li::before { content: "+ "; font-family: var(--font-mono); color: var(--court); }
.upgrade[hidden] { display: none; }

/* browse */
.finder { display: grid; gap: 14px; }
.search-row { display: flex; flex-wrap: wrap; gap: 10px; }
.search-row input[type="search"], .search-row select { min-height: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: 400 15px var(--font-body); padding: 0 12px; }
.search-row input[type="search"] { flex: 1 1 220px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--font-body); cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.glossary { font-size: 13px; color: var(--ink-2); }
.glossary summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.glossary dl { margin: 6px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; }
.glossary dt { font-family: var(--font-mono); color: var(--ink); }
.glossary dd { margin: 0; }
.results-meta { font: 500 13px var(--font-mono); color: var(--ink-2); }
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.color { color: var(--ink-2); font-size: 13px; }
.specs { display: flex; flex-wrap: wrap; gap: 6px; }
.spec { font: 400 12px var(--font-mono); background: var(--surface-2); border-radius: 6px; padding: 4px 8px; cursor: help; }
.prices { border-top: 1px solid var(--line); }
.prices li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.prices li.best { background: var(--surface-2); margin-inline: -8px; padding-inline: 8px; border-radius: 6px; border-bottom-color: transparent; }
.store { min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-weight: 500; }
.sample { font: 400 11px var(--font-mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; cursor: help; }
.low { font: 500 11px var(--font-mono); background: var(--court); color: var(--court-ink); border-radius: 4px; padding: 2px 6px; text-transform: uppercase; letter-spacing: .04em; }
.pc { text-align: right; font: 500 15px var(--font-mono); font-variant-numeric: tabular-nums; }
.pc s { display: block; font-weight: 400; font-size: 12px; color: var(--sale); }
.pc.out { color: var(--ink-2); font-weight: 400; font-size: 13px; }
.card-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.inline-note { font-size: 13px; color: var(--sale); }
.empty { grid-column: 1 / -1; padding: 32px 16px; text-align: center; color: var(--ink-2); border: 1.5px dashed var(--line); border-radius: 10px; }
.prefs { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; margin: 0 0 16px; }
.prefs label { display: grid; gap: 4px; font: 500 12px var(--font-mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.prefs select { min-height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--font-body); text-transform: none; letter-spacing: 0; }
.totals-hint { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; }
.prices li .brk { grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); margin-top: -4px; }
.prices li .brk strong { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand-row">
      <svg class="mark" viewBox="0 0 24 44" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <rect x="2" y="2" width="20" height="40" />
        <line x1="2" y1="22" x2="22" y2="22" />
        <line x1="2" y1="14" x2="22" y2="14" />
        <line x1="2" y1="30" x2="22" y2="30" />
        <line x1="12" y1="2" x2="12" y2="14" />
        <line x1="12" y1="30" x2="12" y2="42" />
      </svg>
      <div>
        <h1>Racket Radar</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="plan">
      <span class="pill" id="plan-pill"></span>
      <button class="switch" id="premium-switch" type="button" role="switch" aria-checked="false">
        <span class="track" aria-hidden="true"></span><span data-i18n="previewSw"></span>
      </button>
    </div>
  </header>

  <div class="prefs">
    <label><span id="lbl-country"></span>
      <select id="country"><option value="US">🇺🇸 United States (USD)</option><option value="CA">🇨🇦 Canada (CAD)</option></select></label>
    <label><span id="lbl-region"></span><select id="region"></select></label>
    <label><span id="lbl-lang"></span>
      <select id="lang"><option value="en">English</option><option value="zh">中文</option></select></label>
  </div>

  <p class="demo-note" id="note"></p>

  <div class="layout">
    <aside class="watch" aria-labelledby="watch-h">
      <div class="sec-head"><h2 id="watch-h" data-i18n="watchlist"></h2><span class="count" id="watch-count"></span></div>
      <p class="sub" id="watch-sub"></p>
      <div class="note" id="limit-note" role="status" hidden>
        <span id="limit-text"></span>
        <button class="btn small" type="button" data-action="premium-on" data-i18n="previewSw"></button>
      </div>
      <ul class="wlist" id="watch-list"></ul>
      <section class="upgrade" id="upgrade" aria-labelledby="up-h">
        <h3 id="up-h" data-i18n="premium"></h3>
        <ul>
          <li data-i18n="p1"></li>
          <li data-i18n="p2"></li>
          <li data-i18n="p3"></li>
          <li data-i18n="p4"></li>
          <li data-i18n="p5"></li>
        </ul>
        <button class="btn" type="button" data-action="premium-on" data-i18n="previewSw"></button>
      </section>
    </aside>

    <main class="finder">
      <div class="sec-head"><h2 data-i18n="find"></h2><span class="results-meta" id="results-meta" aria-live="polite"></span></div>
      <div class="search-row">
        <input id="q" type="search" placeholder="Search by name, like Auraspeed" aria-label="Search rackets" autocomplete="off">
        <select id="sort" aria-label="Sort rackets">
          <option value="stores" data-i18n="sMost"></option>
          <option value="low" data-i18n="sLow"></option>
          <option value="high" data-i18n="sHigh"></option>
          <option value="off" data-i18n="sOff"></option>
        </select>
      </div>
      <p class="totals-hint" id="totals-hint" hidden></p>
      <div class="chips" id="brands" role="group" aria-label="Filter by brand"></div>
      <details class="glossary">
        <summary data-i18n="gloss"></summary>
        <dl>
          <dt>4U</dt><dd data-i18n="g4u"></dd>
          <dt>G5</dt><dd data-i18n="gg5"></dd>
          <dt>Head heavy</dt><dd data-i18n="ghh"></dd>
          <dt>Head light</dt><dd data-i18n="ghl"></dd>
        </dl>
      </details>
      <div class="results" id="results"></div>
    </main>
  </div>
</div>

    FX = (d.fx && d.fx.CAD) || (d.stores.yumo && d.stores.yumo.rate) || 0.71;
    watch = watch.filter(function (id) { return byId(id); });
    renderAll();
  }).catch(function () { loadError = true; renderAll(); });
})();
</script>
