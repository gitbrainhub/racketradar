name: Update prices
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scraper/scrape.py
      - name: Save new prices
        run: |
          git config user.name "racket-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Update prices"
          git push
