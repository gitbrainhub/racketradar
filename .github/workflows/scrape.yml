name: Update prices
on:
  schedule:
    - cron: "17 14 */3 * *"     # every 3rd day
  workflow_dispatch: {}          # the manual "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**"]           # you uploaded a site change: just republish, don't re-scrape

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scraper/scrape.py
      - name: Save new prices
        run: |
          git config user.name "racket-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Update prices"
          git push

  deploy:
    needs: scrape
    if: ${{ !cancelled() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
